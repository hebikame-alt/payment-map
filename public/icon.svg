<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22394A"/>
      <stop offset="1" stop-color="#14222B"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E63F0"/>
      <stop offset="1" stop-color="#5B4FE0"/>
    </linearGradient>
  </defs>

  <!-- Navy background (full-bleed; iOS applies its own corner mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="432" rx="76" ry="16" fill="#5B4FE0" opacity="0.35"/>

  <!-- Map pin -->
  <path d="M256 428C222 382 128 292 128 214a128 128 0 0 1 256 0c0 78-94 168-128 214Z" fill="url(#pin)"/>

  <!-- Wallet inside the pin head -->
  <rect x="180" y="164" width="152" height="104" rx="18" fill="#FFFFFF"/>
  <path d="M180 196h152" stroke="#5B4FE0" stroke-width="14"/>
  <rect x="270" y="214" width="62" height="36" rx="10" fill="#ECEAFB"/>
  <circle cx="292" cy="232" r="8" fill="#5B4FE0"/>
</svg>
